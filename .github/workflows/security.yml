name: Security

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.1.2" "setuptools>=83.0.0"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip_audit
      - name: Validate supply-chain manifests
        run: >-
          python -c "import json;
          json.load(open('packaging/components.json', encoding='utf-8'));
          json.load(open('sbom.cdx.json', encoding='utf-8'))"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan full Git history for secrets
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --no-banner --log-opts="--all" /repo
