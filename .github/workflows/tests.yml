name: Tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.1.2" "setuptools>=83.0.0"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  gui:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.1.2" "setuptools>=83.0.0"
      - run: python -m pip install -e ".[dev,gui-test]"
      - run: >-
          python -m pytest --no-cov
          tests/test_gui_workers.py tests/test_gui_window.py
