name: Windows Installer End-to-End

on:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-e2e:
    name: Build, install, transcribe and uninstall
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      MODEL_NAME: tiny-q5_1
      APP_DIR: ${{ runner.temp }}\TropaTranscribeLocal-E2E
      EVIDENCE_DIR: ${{ runner.temp }}\tropa-e2e-evidence

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Preflight repository files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            ".\scripts\windows\build-gui.ps1",
            ".\packaging\windows\installer.iss",
            ".\tests\integration\packaged-exe-smoke.ps1"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Arquivo obrigatório ausente: $path"
            }
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip>=26.1.2" "setuptools>=83.0.0"
          python -m pip install -e ".[dev,gui-test,packaging]"

      - name: Quality gates
        shell: pwsh
        run: |
          python -m pytest
          python -m ruff check .
          python -m mypy app tools
          git diff --check

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 7\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe")
          )
          $iscc = $candidates |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $iscc) {
            winget install --id JRSoftware.InnoSetup --exact --silent `
              --accept-package-agreements --accept-source-agreements `
              --disable-interactivity
            if ($LASTEXITCODE -ne 0) {
              throw "winget falhou ao instalar Inno Setup: código $LASTEXITCODE."
            }
            $iscc = $candidates |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
              Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup 7 não foi localizado."
          }
          $version = (Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion
          if (-not $version -or ([version]$version -lt [version]"7.0.2")) {
            throw "Inno Setup 7.0.2 ou superior é obrigatório; encontrado: $version"
          }
          Write-Host "Inno Setup validado: $version"

      - name: Build bundle and installer
        shell: pwsh
        run: .\scripts\windows\build-gui.ps1 -BuildInstaller

      - name: Record build evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE_DIR | Out-Null
          $bundle = (Resolve-Path -LiteralPath ".\dist\TropaTranscribeLocal").Path
          $exe = (Resolve-Path -LiteralPath ".\dist\TropaTranscribeLocal\TropaTranscribeLocal.exe").Path
          $installer = (Resolve-Path -LiteralPath ".\dist\installer\TropaTranscribeLocal-0.3.1-alpha-setup.exe").Path
          $files = @(Get-ChildItem -LiteralPath $bundle -Recurse -File)
          $evidence = [ordered]@{
            commit = $env:GITHUB_SHA
            bundle_files = $files.Count
            bundle_size_bytes = ($files | Measure-Object Length -Sum).Sum
            exe_size_bytes = (Get-Item -LiteralPath $exe).Length
            exe_sha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
            installer_size_bytes = (Get-Item -LiteralPath $installer).Length
            installer_sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
            installer_authenticode = (Get-AuthenticodeSignature -LiteralPath $installer).Status.ToString()
          }
          $evidence | ConvertTo-Json | Set-Content -LiteralPath `
            (Join-Path $env:EVIDENCE_DIR "build-evidence.json") -Encoding utf8
          $evidence | Format-List

      - name: Reject silent install without consent
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Resolve-Path -LiteralPath ".\dist\installer\TropaTranscribeLocal-0.3.1-alpha-setup.exe").Path
          $arguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=$env:APP_DIR"
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -eq 0) {
            throw "Instalação silenciosa sem consentimento foi aceita."
          }
          "exit_code=$($process.ExitCode)" | Set-Content -LiteralPath `
            (Join-Path $env:EVIDENCE_DIR "install-without-consent.txt") -Encoding utf8

      - name: Install with explicit consent
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Resolve-Path -LiteralPath ".\dist\installer\TropaTranscribeLocal-0.3.1-alpha-setup.exe").Path
          $arguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/ACCEPTLICENSE=YES",
            "/DIR=$env:APP_DIR"
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Instalação consentida falhou: código $($process.ExitCode)."
          }
          $installedExe = Join-Path $env:APP_DIR "TropaTranscribeLocal.exe"
          if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) {
            throw "Executável instalado não localizado: $installedExe"
          }

      - name: Provision pinned runtimes and model
        shell: pwsh
        run: |
          python -c "from app.services.runtime_provisioning import install_component; from app.services.model_download import download_model; install_component('ffmpeg'); install_component('whisper_cpp'); download_model('$env:MODEL_NAME')"

      - name: Run packaged transcription smoke
        shell: pwsh
        run: |
          $installedExe = Join-Path $env:APP_DIR "TropaTranscribeLocal.exe"
          .\tests\integration\packaged-exe-smoke.ps1 `
            -Executable $installedExe `
            -Model $env:MODEL_NAME `
            -WorkDirectory (Join-Path $env:EVIDENCE_DIR "transcription-smoke")

      - name: Uninstall and verify cleanup
        if: always()
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:APP_DIR "unins000.exe"
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            Write-Warning "Desinstalador não encontrado; a instalação pode não ter sido concluída."
            exit 0
          }
          $arguments = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
          $process = Start-Process -FilePath $uninstaller -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Desinstalação falhou: código $($process.ExitCode)."
          }
          if (Test-Path -LiteralPath (Join-Path $env:APP_DIR "TropaTranscribeLocal.exe")) {
            throw "Executável permaneceu após a desinstalação."
          }

      - name: Upload text evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-e2e-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\tropa-e2e-evidence\**\*.txt
            ${{ runner.temp }}\tropa-e2e-evidence\**\*.log
            ${{ runner.temp }}\tropa-e2e-evidence\**\*.json
            dist\manifest\*.json
            dist\manifest\*.txt
          if-no-files-found: warn
          retention-days: 14
