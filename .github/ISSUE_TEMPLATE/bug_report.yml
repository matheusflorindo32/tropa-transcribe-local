name: Relatar erro
description: Informe um comportamento reproduzível sem anexar mídia ou transcrição sensível.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Não publique áudio, transcrição, caminhos pessoais ou dados sensíveis."
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: O que aconteceu e o que era esperado?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Sistema
      options: [Windows, Linux, macOS]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnóstico sanitizado
      description: Remova nomes, caminhos pessoais e conteúdo.
