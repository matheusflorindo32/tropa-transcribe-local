[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tropa-transcribe-local"
version = "0.2.0b1"
description = "Transcrição local e privada com FFmpeg e whisper.cpp."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Tropa Científica" }]
keywords = ["whisper", "speech-to-text", "privacy", "transcription"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
dev = [
  "mypy>=1.15,<2",
  "pip-audit>=2.8,<3",
  "pre-commit>=4.1,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]
packaging = ["pyinstaller>=6.21,<7"]

[project.scripts]
tropa-transcribe = "app.cli:main"
tropa-transcribe-gui = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["app/ui/*", "app/main.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"tools/*" = ["S310"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tools"]
exclude = ["app/ui", "app/main.py"]
